services:
  backend:
    build: .
    ports: ["8000:8000"]
    environment:
      NETSAGE_DB: /app/storage/netsage.db
    volumes: ["netsage_data:/app/storage"]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [backend]
volumes:
  netsage_data:
